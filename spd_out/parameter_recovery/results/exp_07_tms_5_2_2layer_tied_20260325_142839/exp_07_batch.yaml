wandb_project: spd_tms_5_2_exp07
runs:
  - run_name: exp_07_tms_5_2_2layer_tied
    target_config:
      wandb_project: null
      tms_model_config:
        n_features: 5
        n_hidden: 2
        n_hidden_layers: 0
        tied_weights: true
        init_bias_to_zero: false
        device: cpu
      feature_probability: 0.05
      batch_size: 1024
      steps: 10000
      seed: 0
      lr_schedule:
        start_val: 0.005
        fn_type: constant
        warmup_pct: 0.0
        final_val_frac: 1.0
      weight_decay: 0.01
      data_generation_type: at_least_zero_active
      fixed_identity_hidden_layers: false
      fixed_random_hidden_layers: false
      synced_inputs: null
    spd_config:
      wandb_project: null
      wandb_run_name: null
      wandb_run_name_prefix: ""
      seed: 0
      n_mask_samples: 1
      ci_config:
        mode: layerwise
        fn_type: mlp
        hidden_dims: [16]
      sampling: continuous
      sigmoid_type: leaky_hard
      module_info:
        - module_pattern: linear1
          C: 20
        - module_pattern: linear2
          C: 20
      use_delta_component: true
      loss_metric_configs:
        - classname: ImportanceMinimalityLoss
          coeff: 0.003
          pnorm: 1.0
          beta: 0.0
        - classname: StochasticReconLayerwiseLoss
          coeff: 1.0
        - classname: StochasticReconLoss
          coeff: 1.0
      output_loss_type: mse
      batch_size: 4096
      eval_batch_size: 4096
      steps: 10000
      lr_schedule:
        start_val: 0.001
        fn_type: cosine
        warmup_pct: 0.0
        final_val_frac: 0.0
      faithfulness_warmup_steps: 200
      faithfulness_warmup_lr: 0.01
      faithfulness_warmup_weight_decay: 0.1
      train_log_freq: 100
      eval_freq: 1000
      n_eval_steps: 100
      slow_eval_freq: 5000
      save_freq: 5000
      ci_alive_threshold: 0.1
      eval_metric_configs:
        - classname: CIHistograms
          n_batches_accum: 5
        - classname: ComponentActivationDensity
        - classname: PermutedCIPlots
          identity_patterns: [linear1, linear2]
          dense_patterns: null
        - classname: IdentityCIError
          identity_ci:
            - layer_pattern: linear1
              n_features: 5
            - layer_pattern: linear2
              n_features: 5
          dense_ci: null
        - classname: CI_L0
          groups: null
        - classname: CIMeanPerComponent
        - classname: StochasticHiddenActsReconLoss
      pretrained_model_class: spd.experiments.tms.models.TMSModel
      pretrained_model_path: null
      pretrained_model_name: null
      pretrained_model_output_attr: null
      tokenizer_name: null
      task_config:
        task_name: tms
        feature_probability: 0.05
        data_generation_type: at_least_zero_active

