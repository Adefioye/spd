run_name: exp_01_axis_aligned_resid_mlp
seed: 0
synthetic:
  stage: axis_aligned
  dictionary:
    num_features: 8
    hidden_dim: 8
    initializer: identity
    seed: 0
  generator:
    default_probability: 0.125
    mean_firing_magnitudes: 1.0
    std_firing_magnitudes: 0.05
    seed: 0
target:
  model_type: resid_mlp
  resid_mlp_model_config:
    n_features: 8
    d_embed: 8
    d_mlp: 16
    n_layers: 2
    act_fn_name: relu
    in_bias: false
    out_bias: false
  batch_size: 1024
  steps: 4000
  print_freq: 200
  lr_schedule:
    start_val: 0.001
    fn_type: cosine
    warmup_pct: 0.0
    final_val_frac: 0.0
  label_type: identity
  loss_type: readoff
  fixed_embedding: identity
spd:
  spd_config_path: koko_experiments/parameter_recovery/experiments/exp_01_axis_aligned/spd_resid_mlp.yaml
analysis:
  enabled: true
  input_magnitude: 1.0
  sampling: lower_leaky
