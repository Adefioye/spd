dataset:
  dictionary:
    num_features: 16
    hidden_dim: 32
    seed: 0
    initializer: orthogonal
  generator:
    default_probability: 0.1
    mean_firing_magnitudes: 1.0
    std_firing_magnitudes: 0.05
    seed: 0
resid_mlp_model_config:
  n_features: 16
  d_embed: 32
  d_mlp: 24
  n_layers: 1
  act_fn_name: relu
  in_bias: false
  out_bias: false
label_type: act_plus_resid
loss_type: readoff
fixed_embedding: feature_dictionary
freeze_embedding: true
batch_size: 2048
steps: 6000
print_freq: 100
lr_schedule:
  start_val: 0.003
  fn_type: cosine
  warmup_pct: 0.0
  final_val_frac: 0.0
n_eval_batches: 20
seed: 0
run_name: resid_mlp_dictionary_orthogonal
